<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Traffic Monitor</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> </head> <body>

<button class="menu-btn" id="menuBtn"><i class="bi bi-list"></i></button>

<div class="sidebar" id="sidebar"> <h2 class="logo"><i class="bi bi-shield-lock-fill me-2"></i>SecureShield</h2> <a href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a> <a href="/traffic" class="active"><i class="bi bi-activity me-2"></i>Traffic Monitor</a> <a href="/alerts"><i class="bi bi-exclamation-triangle me-2"></i>Alerts</a> <a href="/blocked"><i class="bi bi-slash-circle me-2"></i>Blocked IPs</a> <a href="/portscan"><i class="bi bi-search me-2"></i>Port Scan</a> <a href="/bruteforce"><i class="bi bi-key me-2"></i>Brute Force</a> <a href="/lab"><i class="bi bi-terminal me-2"></i>Attack Lab</a> <a href="/reports"><i class="bi bi-file-earmark-bar-graph me-2"></i>Reports</a> <a href="/settings"><i class="bi bi-gear me-2"></i>Settings</a> <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a> </div>

<div class="main-content">

<div class="topbar">
    <div>
        <h1>Live Traffic Monitor</h1>
        <p style="margin:0; opacity:0.9;">Real-time network traffic analytics</p>
    </div>
</div>

<div class="chart-card">
    <h5 class="mb-3"><i class="bi bi-graph-up-arrow me-2"></i>Network Traffic Trend</h5>
    <canvas id="trafficChart" height="100"></canvas>
</div>

<div class="footer">SecureShield SOC Platform © 2026</div>

</div>

<script> const menuBtn = document.getElementById('menuBtn'); const sidebar = document.getElementById('sidebar'); menuBtn.addEventListener('click', () => { sidebar.classList.toggle('show'); }); document.addEventListener('click', (e) => { if (window.innerWidth <= 992) { if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) { sidebar.classList.remove('show'); } } }); const ctx = document.getElementById('trafficChart'); new Chart(ctx, { type: 'line', data: { labels: ['10:00','10:05','10:10','10:15','10:20','10:25'], datasets: [{ label: 'Packets/sec', data: [120,180,160,220,200,260], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', fill: true, tension: 0.4 }] } }); </script>

</body> </html>
