<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Settings</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> </head> <body>

<button class="menu-btn" id="menuBtn"><i class="bi bi-list"></i></button>

<div class="sidebar" id="sidebar"> <h2 class="logo"><i class="bi bi-shield-lock-fill me-2"></i>SecureShield</h2> <a href="/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a> <a href="/traffic"><i class="bi bi-activity me-2"></i>Traffic Monitor</a> <a href="/alerts"><i class="bi bi-exclamation-triangle me-2"></i>Alerts</a> <a href="/blocked"><i class="bi bi-slash-circle me-2"></i>Blocked IPs</a> <a href="/portscan"><i class="bi bi-search me-2"></i>Port Scan</a> <a href="/bruteforce"><i class="bi bi-key me-2"></i>Brute Force</a> <a href="/lab"><i class="bi bi-terminal me-2"></i>Attack Lab</a> <a href="/reports"><i class="bi bi-file-earmark-bar-graph me-2"></i>Reports</a> <a href="/settings" class="active"><i class="bi bi-gear me-2"></i>Settings</a> <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a> </div>

<div class="main-content">

<div class="topbar">
    <div>
        <h1>System Settings</h1>
        <p style="margin:0; opacity:0.9;">Detection thresholds and application settings</p>
    </div>
</div>

<div class="table-section">

    <form class="row g-3">

        <div class="col-md-6">
            <label class="form-label">Alert Threshold</label>
            <input type="number" class="form-control search-box" value="20">
        </div>

        <div class="col-md-6">
            <label class="form-label">Port Scan Threshold</label>
            <input type="number" class="form-control search-box" value="10">
        </div>

        <div class="col-md-6">
            <label class="form-label">Log Retention (days)</label>
            <input type="number" class="form-control search-box" value="30">
        </div>

        <div class="col-md-6">
            <label class="form-label">Theme</label>
            <select class="form-select search-box">
                <option selected>Blue & White</option>
                <option>Dark</option>
            </select>
        </div>

        <div class="col-12">
            <button type="button" class="btn btn-primary-custom">
                <i class="bi bi-save me-1"></i>Save Settings
            </button>
        </div>

    </form>

</div>

<div class="footer">SecureShield SOC Platform © 2026</div>

</div>

<script> const menuBtn = document.getElementById('menuBtn'); const sidebar = document.getElementById('sidebar'); menuBtn.addEventListener('click', () => sidebar.classList.toggle('show')); document.addEventListener('click', (e) => { if (window.innerWidth <= 992) { if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) { sidebar.classList.remove('show'); } } }); </script>

</body> </html>
