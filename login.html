<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>SecureShield Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#f8fbff 0%,#e8f1ff 100%);
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        overflow:hidden;
        position:relative;
    }

    /* Background Glow */
    body::before{
        content:'';
        position:absolute;
        width:450px;
        height:450px;
        background:radial-gradient(circle, rgba(37,99,235,0.18) 0%, rgba(37,99,235,0) 70%);
        top:-120px;
        left:-120px;
        border-radius:50%;
    }

    body::after{
        content:'';
        position:absolute;
        width:420px;
        height:420px;
        background:radial-gradient(circle, rgba(59,130,246,0.18) 0%, rgba(59,130,246,0) 70%);
        bottom:-120px;
        right:-120px;
        border-radius:50%;
    }

    .login-container{
        width:100%;
        max-width:430px;
        padding:20px;
        position:relative;
        z-index:2;
    }

    .login-card{
        background:#ffffff;
        border:1px solid #dbeafe;
        border-radius:24px;
        padding:42px 36px;
        box-shadow:
            0 20px 45px rgba(15,23,42,0.10),
            0 8px 20px rgba(37,99,235,0.08);
        text-align:center;
    }

    .shield-icon{
        width:78px;
        height:78px;
        margin:0 auto 18px;
        border-radius:18px;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        display:flex;
        align-items:center;
        justify-content:center;
        color:#fff;
        font-size:2rem;
        box-shadow:0 10px 24px rgba(37,99,235,0.28);
    }

    .login-title{
        font-size:2rem;
        font-weight:800;
        color:#0f172a;
        margin-bottom:8px;
    }

    .login-subtitle{
        color:#64748b;
        font-size:0.95rem;
        margin-bottom:28px;
    }

    .form-control{
        height:54px;
        border-radius:14px;
        border:1px solid #cbd5e1;
        padding-left:48px;
        font-size:1rem;
        background:#fff;
        transition:all .25s ease;
    }

    .form-control:focus{
        border-color:#2563eb;
        box-shadow:0 0 0 4px rgba(37,99,235,.15);
    }

    .input-group{
        position:relative;
        margin-bottom:18px;
    }

    .input-icon{
        position:absolute;
        left:16px;
        top:50%;
        transform:translateY(-50%);
        color:#64748b;
        z-index:10;
    }

    .login-btn{
        width:100%;
        height:54px;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,#2563eb,#1d4ed8);
        color:#fff;
        font-size:1rem;
        font-weight:700;
        transition:all .25s ease;
        box-shadow:0 10px 20px rgba(37,99,235,.22);
    }

    .login-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 14px 28px rgba(37,99,235,.28);
    }

    .login-btn:active{
        transform:translateY(0);
    }

    .default-box{
        margin-top:24px;
        padding:14px;
        border-radius:14px;
        background:#eff6ff;
        border:1px solid #bfdbfe;
        color:#1e3a8a;
        font-size:0.92rem;
        font-weight:600;
    }

    .default-box span{
        color:#2563eb;
        font-weight:800;
    }

    .footer-text{
        margin-top:18px;
        font-size:0.8rem;
        color:#94a3b8;
    }

    @media (max-width:576px){

        .login-card{
            padding:34px 24px;
            border-radius:20px;
        }

        .login-title{
            font-size:1.75rem;
        }

        .shield-icon{
            width:70px;
            height:70px;
            font-size:1.8rem;
        }
    }
</style>

</head> <body>

<div class="login-container">

<div class="login-card">

    <div class="shield-icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h1 class="login-title">SecureShield</h1>

    <p class="login-subtitle">
        Security Operations Center Access
    </p>

    <form method="POST">

        <div class="input-group">
            <i class="bi bi-person-fill input-icon"></i>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username"
                   required>
        </div>

        <div class="input-group">
            <i class="bi bi-lock-fill input-icon"></i>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit" class="login-btn">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Login
        </button>

    </form>

    <div class="default-box">
        Default: <span>admin / admin123</span>
    </div>

    <div class="footer-text">
        IDS / IPS Monitoring Platform • Secure Access
    </div>

</div>

</div>

</body> </html>
